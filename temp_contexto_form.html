<form id="form-contexto" class="space-y-4 hidden">
    <input type="hidden" id="contexto-id">
    <div>
        <label class="block text-sm font-semibold mb-1">Nome do Contexto/Papel</label>
        <input type="text" id="contexto-nome" class="w-full border border-[var(--border-color)] rounded p-2 bg-[var(--bg-color)]" placeholder="Ex: Trabalho, Pai, Estudante..." required>
    </div>
    <div class="pt-4 flex justify-end space-x-2">
        <button type="button" class="btn-cancel-modal px-4 py-2 border border-[var(--border-color)] rounded">Cancelar</button>
        <button type="submit" class="px-4 py-2 text-white bg-[var(--primary-color)] rounded">Salvar</button>
    </div>
</form>
